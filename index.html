<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Block Maths Quest – earn Robux points!</title>
<style>
:root{--ink:#14142b;--sky1:#38bdf8;--sky2:#6366f1;--green:#22c55e;--red:#ef4444;--yellow:#facc15;--blue:#3b82f6;--orange:#f97316;--purple:#a855f7;--card:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Avenir Next","Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,sans-serif;font-weight:700;color:var(--ink);
 background:linear-gradient(160deg,var(--sky1),var(--sky2));min-height:100vh;min-height:100dvh;overflow-x:hidden;
 -webkit-user-select:none;user-select:none;touch-action:manipulation}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
 background-image:linear-gradient(90deg,#fff 2px,transparent 2px),linear-gradient(#fff 2px,transparent 2px);background-size:48px 48px}
button,a.bitelink{font-family:inherit;font-weight:900;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
 background:var(--ink);color:#fff;border-bottom:5px solid #000;min-height:72px}
#hdr .brand{font-size:20px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
#hdr .brand b{color:var(--yellow)}
#hdr .who{display:flex;align-items:center;gap:10px;min-width:0}
#hdr .who .nm{font-size:18px;max-width:210px;overflow:hidden;display:flex;align-items:center;gap:4px}
#hdr .who .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:3px 10px;border-radius:6px;border:3px solid #000;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:#14142b}
.t-Noob{background:#cbd5e1}.t-Builder{background:#fdba74}.t-Pro{background:#93c5fd}.t-Legend{background:linear-gradient(90deg,#fde047,#f472b6,#a78bfa)}
.spacer{flex:1}
.bank{display:flex;align-items:center;gap:8px;background:#000;border:3px solid var(--yellow);border-radius:10px;padding:4px 12px 4px 6px;font-size:22px;color:var(--yellow)}
.bank.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.25)}100%{transform:scale(1)}}
.hbtn{background:#2a2a4a;color:#fff;border:3px solid #000;border-radius:10px;padding:8px 10px;font-size:15px;box-shadow:0 4px 0 #000;display:flex;align-items:center;gap:6px}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.hbtn svg{width:22px;height:22px}
.coin{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:50%;font-size:.7em;font-weight:900;color:#7a4a00;
 background:radial-gradient(circle at 35% 30%,#fff7b0,#facc15 45%,#d99100);border:3px solid #7a4a00;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex:none;letter-spacing:-.5px}
.coin.big{font-size:28px}
#app{position:relative;max-width:1180px;margin:0 auto;padding:18px 18px 40px}
.card{background:var(--card);border:5px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 var(--ink);padding:20px}
h1,h2,h3{margin:0 0 10px;font-weight:900}
h1{font-size:44px;line-height:1.05;text-transform:uppercase;letter-spacing:1px}
h2{font-size:30px}
h3{font-size:22px}
.muted{color:#55557a;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:4px solid var(--ink);border-radius:12px;box-shadow:0 6px 0 var(--ink);
 padding:14px 22px;font-size:22px;background:var(--yellow);transition:transform .05s}
.btn:active{filter:brightness(.95)}
.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.grey{background:#e2e8f0}
.btn.purple{background:var(--purple);color:#fff}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.start{display:grid;grid-template-columns:300px 1fr;gap:22px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.hero h1{color:#fff;text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink)}
.hero .avatarBox{background:rgba(255,255,255,.25);border:5px solid var(--ink);border-radius:14px;padding:10px 26px;box-shadow:0 8px 0 var(--ink)}
input.name{width:100%;font:inherit;font-size:28px;font-weight:900;padding:12px 14px;border:4px solid var(--ink);border-radius:12px;outline:none;-webkit-user-select:text;user-select:text}
input.name:focus{background:#fffbe6}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:3px solid var(--ink);border-radius:10px;background:#e0f2fe;padding:6px 12px;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.chip.on{background:var(--yellow)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.lvl{text-align:left;border:5px solid var(--ink);border-radius:14px;box-shadow:0 7px 0 var(--ink);padding:14px;color:#fff;min-height:118px;display:flex;flex-direction:column;gap:6px}
.lvl:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.lvl .t{font-size:24px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.lvl .d{font-size:15px;font-weight:700;opacity:.95;line-height:1.3}
.lvl .tag{align-self:flex-start;background:rgba(0,0,0,.3);border-radius:6px;padding:2px 8px;font-size:14px}
.lvl:last-child:nth-child(odd){grid-column:1 / -1}
.l1{background:linear-gradient(135deg,#22c55e,#15803d)}.l2{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.l3{background:linear-gradient(135deg,#f97316,#c2410c)}.l4{background:linear-gradient(135deg,#7c3aed,#4c1d95)}
.l5{background:linear-gradient(135deg,#7f1d1d,#111);border-color:#000}
.l5 .t{color:#fde047}
.err{color:var(--red);font-size:18px;min-height:24px;margin-top:6px}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:12px;color:#fff;flex-wrap:wrap}
.blocks{display:flex;gap:6px}
.blocks i{width:26px;height:26px;border:3px solid var(--ink);border-radius:6px;background:rgba(255,255,255,.35)}
.blocks i.ok{background:var(--green)}.blocks i.no{background:var(--red)}.blocks i.pass{background:#c4b5fd}.blocks i.cur{background:var(--yellow);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.tagbox{background:var(--ink);border:3px solid #000;border-radius:10px;padding:6px 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.streak{color:#fdba74}
.quiz{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
.qcard{min-height:280px;display:flex;flex-direction:column;gap:12px}
.qnum{font-size:16px;color:#55557a;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.dpill{border-radius:8px;padding:2px 8px;border:3px solid var(--ink);font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink)}
.d-easy{background:#bbf7d0}.d-medium{background:#fde68a}.d-hard{background:#fecaca}
.qtext{font-size:34px;line-height:1.3;font-weight:900;flex:1;display:flex;align-items:flex-start}
.qtext>span.qi{display:block;width:100%}
.qtext.long{font-size:26px}
.qtext b{color:#1d4ed8}
.qlead{display:block;margin-bottom:8px}
.blank{display:inline-block;min-width:1.4em;border-bottom:4px solid var(--ink);text-align:center;color:#c2410c}
.speed{height:18px;border:4px solid var(--ink);border-radius:8px;background:#e2e8f0;overflow:hidden;position:relative}
.speed span{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#22c55e,#facc15);transform-origin:left;transition:transform .1s linear}
.speedlbl{font-size:15px;color:#55557a;display:flex;justify-content:space-between}
.speed.half span{background:linear-gradient(90deg,#f97316,#facc15)}
.halfbanner{background:#c2410c;color:#fff;border:4px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:26px;line-height:1.2;text-align:center;box-shadow:0 4px 0 var(--ink)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.78em;line-height:1.08;margin:0 .1em}
.frac>span:first-child{border-bottom:.12em solid currentColor;padding:0 .18em}
.mixed{white-space:nowrap}
table.mini{border-collapse:collapse;width:100%;font-size:18px;margin:4px 0 6px;background:#fff}
table.mini th,table.mini td{border:3px solid var(--ink);padding:6px 8px;text-align:center}
table.mini th{background:#dbeafe;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;margin:8px 0;padding:8px 8px 4px;background:#f8fafc;border:3px solid var(--ink);border-radius:10px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:14px;gap:2px}
.bars .col i{display:block;width:100%;max-width:48px;background:#3b82f6;border:3px solid var(--ink);border-bottom:none}
.bars .col span{font-size:16px}
.chartsvg{width:100%;height:auto;max-width:460px;background:#f8fafc;border:3px solid var(--ink);border-radius:10px;display:block}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.choice{min-height:96px;font-size:28px;border:5px solid var(--ink);border-radius:14px;box-shadow:0 7px 0 var(--ink);background:#fff;padding:10px}
.choice:nth-child(1){background:#fde68a}.choice:nth-child(2){background:#bfdbfe}.choice:nth-child(3){background:#bbf7d0}.choice:nth-child(4){background:#fbcfe8}
.choice:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.choice.right{background:var(--green)!important;color:#fff}.choice.wrong{background:var(--red)!important;color:#fff;opacity:.85}
.choice.dim{opacity:.45}
.disp{display:flex;align-items:center;justify-content:center;gap:8px;height:76px;border:5px solid var(--ink);border-radius:14px;background:#fff;font-size:40px;margin-bottom:12px;box-shadow:inset 0 4px 0 rgba(0,0,0,.08)}
.disp .cur{display:inline-block;width:4px;height:40px;background:var(--ink);animation:blink 1s steps(1) infinite}
.disp .aff{color:#55557a;font-size:28px}
@keyframes blink{50%{opacity:0}}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.key{height:64px;font-size:30px;border:4px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);background:#fff}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.key.fn{background:#e2e8f0;font-size:26px}.key.go{background:var(--green);color:#fff;grid-row:span 2;height:auto;font-size:36px}
.helpbtn{width:100%;background:#ede9fe;color:#5b21b6;border:4px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);padding:12px 14px;font-size:20px;text-align:center}
.helpbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.helpbtn:disabled{opacity:1;transform:none;box-shadow:0 5px 0 var(--ink);cursor:default}
.helppanel{background:#f5f3ff;border:4px solid #7c3aed;border-radius:12px;padding:14px}
.helptop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.helppanel h3{margin:8px 0 6px;color:#5b21b6}
.helppanel .hint{font-size:19px;line-height:1.4;background:#fff;border-radius:10px;padding:10px 12px;border:3px dashed #7c3aed}
.helppanel ol{margin:6px 0 10px 22px;padding:0;font-size:18px;line-height:1.45}
.helppanel li{margin:0 0 6px}
.bitelink{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:#111827;color:#fff!important;border:4px solid #000;border-radius:12px;box-shadow:0 5px 0 #000;padding:12px 14px;font-size:18px;margin:8px 0}
.bitelink:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.fb{border:5px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 var(--ink);padding:18px;animation:slide .25s ease-out}
@keyframes slide{from{transform:translateY(20px);opacity:0}}
.fb.good{background:#dcfce7}.fb.bad{background:#fff7ed}.fb.pass{background:#f5f3ff;border-color:#7c3aed}
.fb h2{font-size:32px;margin-bottom:6px}
.fb.good h2{color:#15803d}.fb.bad h2{color:#c2410c}.fb.pass h2{color:#5b21b6}
.passbanner{background:#5b21b6;color:#fff;border:4px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:22px;font-weight:900;margin-bottom:10px}
.fb .ex{font-size:19px;line-height:1.45;font-weight:700;margin:8px 0 14px}
.bon{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.bon span{background:var(--ink);color:var(--yellow);border-radius:8px;padding:5px 10px;font-size:18px}
.ansbig{font-size:28px;font-weight:900}
.center{text-align:center}
.score{font-size:72px;line-height:1;margin:6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:20px}
.tbl td,.tbl th{padding:9px 10px;border-bottom:3px solid #e2e8f0;text-align:left}
.tbl th{font-size:16px;text-transform:uppercase;color:#55557a}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.tot td{border-top:4px solid var(--ink);font-size:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.unlock{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#fef9c3,#fde68a);border:4px solid var(--ink);border-radius:12px;padding:10px 14px;margin:8px 0;animation:slide .4s}
.unlock .u{font-size:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.stat{background:#fff;border:4px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);padding:12px;text-align:center}
.stat .v{font-size:30px;display:flex;align-items:center;justify-content:center;gap:8px}
.stat .k{font-size:14px;color:#55557a;text-transform:uppercase}
.badges{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.badge{border:4px solid var(--ink);border-radius:12px;padding:10px 6px;text-align:center;background:linear-gradient(#fef3c7,#fde68a);box-shadow:0 5px 0 var(--ink)}
.badge.locked{background:#e2e8f0;filter:grayscale(1);opacity:.7}
.badge .amt{font-size:18px;display:flex;justify-content:center;align-items:center;gap:6px}
.badge .bn{font-size:14px;margin-top:4px}.badge .bs{font-size:13px;color:#55557a;margin-top:2px}
.prog{height:26px;border:4px solid var(--ink);border-radius:10px;background:#e2e8f0;overflow:hidden;margin:8px 0}
.prog span{display:block;height:100%;background:repeating-linear-gradient(45deg,#facc15 0 14px,#f59e0b 14px 28px)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:4px solid var(--ink);border-radius:12px;background:#fff;padding:6px;box-shadow:0 4px 0 var(--ink);position:relative;min-width:72px;text-align:center;font-size:13px}
.opt.sel{background:var(--yellow)}
.opt.locked{opacity:.4}
.opt .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.sw{width:56px;height:56px;border-radius:6px;border:3px solid var(--ink);margin:0 auto}
.bar{height:18px;background:#e2e8f0;border:3px solid var(--ink);border-radius:6px;overflow:hidden;min-width:100px}
.bar span{display:block;height:100%}
textarea{width:100%;font:inherit;font-size:20px;padding:10px;border:4px solid var(--ink);border-radius:12px;min-height:80px;-webkit-user-select:text;user-select:text}
.note{background:#eff6ff;border:4px dashed #1d4ed8;border-radius:12px;padding:12px 14px;font-size:18px;line-height:1.4;margin:12px 0}
.sitebar{display:flex;gap:12px;align-items:center;background:#fff;border:4px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:12px;box-shadow:0 5px 0 var(--ink)}
.sitebar svg{height:86px;width:auto;flex:none}
.sitebar .ht{flex:1;min-width:0}
.sitebar .ht b{font-size:18px}
.sitebar .ht p{margin:2px 0 0;font-size:15px;color:#55557a}
.housepage{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
.housesvg{width:100%;height:auto;display:block;background:#7dd3fc;border-radius:12px}
.stlist{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto;-webkit-overflow-scrolling:touch}
.st{display:flex;justify-content:space-between;gap:8px;align-items:center;border:3px solid var(--ink);border-radius:10px;padding:8px 10px;background:#f8fafc;font-size:16px}
.st.done{background:#dcfce7}
.st.now{background:#fef9c3}
.st .need{color:#55557a;font-size:14px}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .6s ease-out;transform-box:fill-box;transform-origin:center bottom}
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,30,.6);display:flex;align-items:center;justify-content:center;padding:20px}
#modal .card{max-width:520px;width:100%;text-align:center}
#modal p{font-size:20px;line-height:1.4}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx,#fx *{pointer-events:none}
#fx .coin{position:absolute;left:0;top:0;font-size:22px}
.floattxt{position:absolute;font-size:28px;font-weight:900;color:var(--yellow);text-shadow:0 3px 0 #000,2px 0 0 #000,-2px 0 0 #000}
.confetti{position:absolute;left:0;top:0;width:14px;height:14px;border:2px solid #000}
.ninjawrap{display:flex;flex-direction:column;gap:10px;min-height:calc(100dvh - 108px)}
.ninjaq .qtext{font-size:28px;flex:none}
.dropnote{font-size:15px;color:#55557a}
.field{position:relative;flex:1;min-height:340px;background:linear-gradient(#1e1b4b,#312e81 55%,#0f172a);border:4px solid var(--ink);border-radius:16px;overflow:hidden;touch-action:none;box-shadow:0 6px 0 var(--ink)}
.field #ans{position:absolute;inset:0;z-index:6;display:flex;align-items:flex-end;justify-content:center;padding:12px;pointer-events:none}
.field #ans:not(:empty){pointer-events:auto;background:rgba(15,23,42,.72)}
.field #ans .fb{width:min(560px,100%);max-height:100%;overflow:hidden;display:flex;flex-direction:column}
.field #ans .fbbody{overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;min-height:0}
.fallchip{position:absolute;left:0;top:0;z-index:3;min-height:84px;padding:10px 12px;border:4px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 #000;font-size:24px;line-height:1.15;text-align:center;touch-action:none;display:flex;align-items:center;justify-content:center}
.fallchip.long{font-size:18px;min-height:84px}
.roundbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;gap:10px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:5px solid var(--ink);box-shadow:0 -6px 0 rgba(0,0,0,.12)}
.roundbar .btn{flex:1;max-width:320px;min-height:64px;font-size:22px;touch-action:manipulation}
body.has-roundbar #app{padding-bottom:108px}
body.ninja-on{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
body.ninja-on #hdr{flex:none;min-height:0;padding:4px 10px;gap:8px}
body.ninja-on #hdr .brand,body.ninja-on #hdr .hbtn:not([data-act="mute"]){display:none}
body.ninja-on #hdr .who svg{height:36px;width:auto}
body.ninja-on #hdr .who .nm{font-size:16px}
body.ninja-on #app{flex:1;min-height:0;max-width:none;margin:0;padding:6px 8px 8px;display:flex;flex-direction:column;overflow:hidden}
body.ninja-on .ninjawrap{position:relative;flex:1;min-height:0;gap:6px}
body.ninja-on #halfslot:not(:empty){position:absolute;left:8px;right:8px;top:42px;z-index:8;pointer-events:none}
body.ninja-on .qtop{margin:0;gap:6px}
body.ninja-on .qtop .tagbox{padding:3px 8px;font-size:14px}
body.ninja-on .blocks i{width:16px;height:16px;border-width:2px}
body.ninja-on .ninjaq{flex:none;max-height:30dvh;overflow:auto;padding:8px 10px;gap:6px;min-height:0;box-shadow:0 4px 0 var(--ink)}
body.ninja-on .ninjaq .qtext{font-size:22px;line-height:1.25}
body.ninja-on .ninjaq .qtext.long{font-size:18px}
body.ninja-on .helpmini{width:auto;padding:6px 12px;font-size:16px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
body.ninja-on .speed{height:12px;border-width:3px}
body.ninja-on .field{flex:1;min-height:0}
body.ninja-on .ninjaguy{width:64px}
body.has-roundbar.ninja-on #app{padding-bottom:8px}
body.has-roundbar .field #ans{padding-bottom:96px}

function sciPick(topic,diff){const pool=SCIENCE.filter(s=>s.topic===topic&&s.diff===diff);if(!pool.length)return null;const s=pick(pool);
 return mcQ(topic,diff,s.text,s.ans,s.wrongs,{bite:s.bite,hint:s.hint,steps:s.steps,long:s.text.length>68});}
G.materials=d=>sciPick('materials',d);
G.space=d=>sciPick('space',d);
G.forces=d=>sciPick('forces',d);
G.living=d=>sciPick('living',d);
G.humans=d=>sciPick('humans',d);
function make(topic,diff){for(let i=0;i<60;i++){let q;try{q=G[topic](diff);}catch(e){q=null;}
 if(!q||q.diff!==diff||q.reward!==REWARD[diff])continue;
 if(!q.hint||!q.steps||q.steps.length<2)continue;
 if(!q.link||q.link.indexOf('https://www.bbc.co.uk/bitesize/')!==0)continue;
 if(q.type==='num'&&!isFinite(q.ans))continue;
 if(q.type==='mc'&&(!q.choices||q.choices.length<4||q.choices.indexOf(q.ans)<0))continue;
 if(q.type==='mc'&&new Set(q.choices).size!==q.choices.length)continue;
 q.subject=SCIENCE_TOPICS[topic]?'Science':'Maths';
 return q;}return null;}

function buildRound(L){const bag=[];for(const t in L.topics)for(let i=0;i<L.topics[t];i++)bag.push(t);
 const qs=[],seen=new Set();let g=0;
 while(qs.length<10&&g++<700){const t=pick(bag);const q=make(t,pick(L.diffs));if(!q||seen.has(q.text))continue;
  const nMC=qs.filter(x=>x.type==='mc').length;if(g<500&&((q.type==='num'&&qs.length-nMC>=7)||(q.type==='mc'&&nMC>=6)))continue;
  seen.add(q.text);qs.push(q);}
 return qs;}

   if(gearOn('pack')&&!Q.packUsed&&Q.me>0&&Q.me<=40){const before=Q.me;Q.me=Math.min(Q.meMax||100,Q.me+35);healed=Q.me-before;Q.packUsed=true;}
   title=opts.pass?'Passed':opts.timeout?'Timed out':'You got hit';sfx.hurt();}
  const hitBit=blocked?'Your Block Shield stopped that hit.':(rank.bot+' hits you for '+dmg+(gearOn('armour')&&!blocked?' (armour reduced it).':'.'));
  const healBit=healed?' Health pack +'+healed+' HP.':'';
  note=opts.pass?('Asking for help passes. No shot. '+hitBit+healBit+' 0 R$.'):opts.timeout?('The extra 30 seconds ran out, so this counts as wrong. '+hitBit+healBit):('Not this time. '+hitBit+healBit+' The answer is '+shownAns(q)+'.');
  if(opts.pass)sfx.click();else if(!blocked)sfx.wrong();}
 grantBadges();
 Q.hit={dmg,crit,incoming,blocked,healed};save();bumpTotal();
 const iWon=Q.foe<=0;const roundOver=Q.foe<=0||Q.me<=0;
 if(roundOver){if(iWon)Q.myRounds++;else Q.foeRounds++;
  if(Q.myRounds>=3||Q.foeRounds>=3){duelGG();return;}
  Q.phase='round';
  renderDuelBoard({q,ok,pass:!!opts.pass,title,note,finisher:iWon});
  if(iWon){const fin=equippedFin();if(fin==='stars'||fin==='boom')confetti();sfx.fanfare();}
  showRoundBar('<button class="btn green" data-act="duelround">Next round</button><button class="btn" data-act="home">Menu</button>');
  return;}
 Q.phase='wait';
 renderDuelBoard({q,ok,pass:!!opts.pass,title,note});
 const fb=$('#fb');if(ok&&fb){coinBurst(fb,Math.max(1,Math.round(late?halfPay(q.reward):q.reward)));floatText(fb,'+'+fmt(late?halfPay(q.reward):q.reward)+' R$');}
 showRoundBar(`<button class="btn ${ok?'green':'blue'}" data-act="duelshot">${ok?'Next shot':'Next shot'}</button><button class="btn" data-act="home">Menu</button>`);}
function duelNextRound(){if(!Q||!Q.duel||Q.phase!=='round')return;if(Q.myRounds>=3||Q.foeRounds>=3){duelGG();return;}Q.me=Q.meMax||100;Q.foe=Q.foeMax||100;Q.shieldLeft=gearOn('shield')?1:0;Q.hit=null;Q.phase='ask';duelAsk();}
function duelGG(){if(!Q||!Q.duel||Q.phase==='gg')return;Q.phase='gg';stopTimer();clearAuto();
 const won=Q.myRounds>Q.foeRounds;const d=player.duel;const bonus=won?WIN_BONUS:0;const before=player.total-roundQuestionPay();
 if(won){d.wins=(d.wins||0)+1;d.streak=(d.streak||0)+1;d.bestStreak=Math.max(d.bestStreak||0,d.streak);if(Q.foeRounds===0)d.flawless=(d.flawless||0)+1;player.total+=bonus;}
 else{d.losses=(d.losses||0)+1;d.streak=0;}
 const freshBadges=grantBadges();
 Q.winBonus=bonus;const earned=clean(roundQuestionPay()+bonus);player.rounds++;
 const rank=rankBy(Q.rank);const myRank=currentRank(d.wins||0);
 player.history.unshift({d:new Date().toISOString(),lvl:'Duel: '+rank.name,score:Q.myRounds,of:Q.myRounds+Q.foeRounds,earned});
 if(player.history.length>200)player.history.length=200;
 const newM=MILESTONES.filter(m=>player.total>=m.at&&player.seen.indexOf(m.at)<0);newM.forEach(m=>player.seen.push(m.at));
 const oldT=titleFor(before),newT=titleFor(player.total);save();
 duelChrome();header();
 const acc=Q.asked?Math.round(Q.right/Q.asked*100):0;const tag=d.tag||'Redliss';
 app.innerHTML=`<div class="gg"><div class="ggtag">${rankIcon(myRank,22)} ${esc(myRank.name)} ${esc(tag)} · vs ${rankIcon(rank,22)} ${esc(rank.name)} ${esc(rank.bot)}</div><h1>GG</h1>
  <div class="ggwho" id="ggwho">${rankIcon(won?myRank:rank,36)} ${won?esc(tag)+' wins!':esc(rank.bot)+' wins'}</div>
  <div class="ggscore">${Q.myRounds} – ${Q.foeRounds}</div>
  <div class="ggstats"><div><b>${acc}%</b><span>Accuracy</span></div><div><b>${Q.best}</b><span>Best streak</span></div><div><b>${Q.dmgDealt}</b><span>Damage dealt</span></div></div>
  <div class="ggear">${won?'Win bonus +'+WIN_BONUS+' R$ · ':''}This match +${fmt(earned)} R$</div>
  <div class="ggear">Win streak ${d.streak}</div>
  ${freshBadges.map(n=>`<div class="ggear">Badge earned: ${esc(n)}</div>`).join('')}
  ${newT!==oldT?`<div class="ggear">Level up: ${newT}</div>`:''}
  ${newM.map(m=>`<div class="ggear">Badge unlocked: ${esc(m.name)}</div>`).join('')}
 </div>`;
 if(won){sfx.fanfare();confetti();}else sfx.wrong();
 showRoundBar('<button class="btn green" data-act="duelagain">Next match</button><button class="btn" data-act="home">Menu</button>');}
function shopCard(kind,item){const d=player.duel;
 const owned=kind==='finisher'?d.finishers.indexOf(item.id)>=0:kind==='gear'?d.gear.indexOf(item.id)>=0:d.owned.indexOf(item.id)>=0;
 const eq=kind==='finisher'?d.finisher===item.id:kind==='gear'?d.gearOn.indexOf(item.id)>=0:d.skin===item.id;
 const dis=!owned&&player.total+1e-9<item.cost;
 const label=eq?'Equipped':owned?(kind==='gear'?'Equip':'Equip'):dis?'Need '+fmt(item.cost-player.total)+' more':'Buy · '+fmt(item.cost)+' R$';
 const art=kind==='finisher'?finSVG(item.id):kind==='gear'?gearSVG(item.id):gunSVG(item.id);
 const extra=kind==='skin'?`<span class="dmgstat">Damage ${weaponLine(item)}</span>`:kind==='gear'?`<span class="dmgstat">${esc(item.blurb)}</span>`:'';
 return `<button class="skin ${eq?'on':''}" type="button" data-act="duelbuy" data-kind="${kind}" data-id="${item.id}" ${dis?'disabled':''}>${art}<b>${esc(item.name)}</b>${extra}<span>${item.cost?fmt(item.cost)+' R$':'Free'}</span><em>${label}</em></button>`;}
function openDuelShop(){if(!needPlayer())return;leaveRound();tidyGear();header();subjectTab='duel';const msg=shopMsg;shopMsg='';window.scrollTo(0,0);
 const d=player.duel;grantBadges();save();
 const badges=BADGES.map(b=>{const on=d.badges.indexOf(b.id)>=0;return `<div class="ach ${on?'':'off'}">${badgeMark(b.id,on)}<div><b>${esc(b.name)}</b><span>${esc(b.detail)} · ${badgeProgress(b.id)}</span></div></div>`;}).join('');
 app.innerHTML=`<div class="card duellobby"><div class="row"><h2 style="margin:0">Weapons, gear and badges</h2><div class="spacer"></div><button class="btn grey" data-act="home">Back</button></div>
  <p class="muted">Pricier weapons deal more damage. The numbers under each weapon are easy / medium / hard hits, before a crit. Gear changes the fight. Badges are earned, not bought. Finishers are cosmetic. Spending R$ does not touch the house.</p>
  <p style="font-size:20px">Bank ${COIN} <b>${fmt(player.total)}</b> · Weapon <b>${esc((SKINS.find(s=>s.id===equippedSkin())||SKINS[0]).name)}</b> · Damage <b>${weaponLine(SKINS.find(s=>s.id===equippedSkin())||SKINS[0])}</b></p>
  ${msg?`<div class="note">${esc(msg)}</div>`:''}
  <h3>Achievement badges</h3><div class="achgrid" id="badgegrid">${badges}</div>
  <h3 style="margin-top:16px">Gear</h3><div class="shopgrid" id="geargrid">${GEAR.map(s=>shopCard('gear',s)).join('')}</div>
  <h3 style="margin-top:16px">Weapons</h3><p class="muted" style="margin-top:-4px">Damage stat: easy / medium / hard. A harder question still hits harder.</p><div class="shopgrid" id="weapongrid">${SKINS.map(s=>shopCard('skin',s)).join('')}</div>
  <h3 style="margin-top:16px">Finishing moves</h3><div class="shopgrid">${FINISHERS.map(s=>shopCard('finisher',s)).join('')}</div>
 </div>`;}
function duelBuy(kind,id){if(!player)return;tidyGear();const d=player.duel;
 if(kind==='gear'){const item=GEAR.find(g=>g.id===id);if(!item)return;
  if(d.gear.indexOf(id)>=0){const i=d.gearOn.indexOf(id);if(i>=0)d.gearOn.splice(i,1);else d.gearOn.push(id);shopMsg=(d.gearOn.indexOf(id)>=0?'Equipped ':'Put away ')+item.name+'.';save();sfx.click();openDuelShop();return;}
  if(player.total+1e-9<item.cost){shopMsg='You need '+fmt(item.cost-player.total)+' more R$ for '+item.name+'.';sfx.wrong();openDuelShop();return;}
  player.total=clean(player.total-item.cost);d.gear.push(id);d.gearOn.push(id);shopMsg='You bought '+item.name+'.';save();header();sfx.coin();openDuelShop();return;}
 const list=kind==='finisher'?FINISHERS:SKINS;const item=list.find(s=>s.id===id);if(!item)return;
 const owned=kind==='finisher'?d.finishers:d.owned;
 if(owned.indexOf(id)>=0){if(kind==='finisher')d.finisher=id;else d.skin=id;shopMsg='Equipped '+item.name+'.';save();sfx.click();openDuelShop();return;}
 if(player.total+1e-9<item.cost){shopMsg='You need '+fmt(item.cost-player.total)+' more R$ for '+item.name+'.';sfx.wrong();openDuelShop();return;}
 player.total=clean(player.total-item.cost);owned.push(id);if(kind==='finisher')d.finisher=id;else d.skin=id;shopMsg='You bought '+item.name+'.';save();header();sfx.coin();openDuelShop();}

function selfTest(){const roman={1:'I',4:'IV',9:'IX',14:'XIV',40:'XL',49:'XLIX',58:'LVIII',90:'XC',99:'XCIX',400:'CD',444:'CDXLIV',900:'CM',999:'CMXCIX',1000:'M'};
 for(const k in roman)if(toRoman(+k)!==roman[k])throw new Error('roman '+k+' '+toRoman(+k));
 const wc=[[21,'twenty-one'],[100,'one hundred'],[101,'one hundred and one'],[115,'one hundred and fifteen'],[1000,'one thousand'],[1001,'one thousand and one'],[1100,'one thousand, one hundred'],[2150,'two thousand, one hundred and fifty'],[20000,'twenty thousand'],[100000,'one hundred thousand'],[101000,'one hundred and one thousand']];
 for(const [n,w] of wc)if(words(n)!==w)throw new Error('words '+n+' got '+words(n));
 for(let i=0;i<80;i++){const a=R(20,99999),b=R(1,a-1);const w=subWork(a,b);if(!w||w.val!==a-b)throw new Error('sub '+a+' '+b);const u=addWork(a,b);if(!u||u.val!==a+b)throw new Error('add '+a+' '+b);}
 const hp=houseProgress(0);if(hp.built.length!==1||hp.next.id!=='foundation')throw new Error('house start');
 const full=HOUSE.reduce((s,x)=>s+x.cost,0);if(!houseProgress(full).done)throw new Error('house done');
 if(houseProgress(full-1).done)throw new Error('house early');
 if(LIMIT!==14||GRACE!==30)throw new Error('timer');
 if(!(FALL_SECS.easy===7&&FALL_SECS.medium===11&&FALL_SECS.hard===16))throw new Error('fall');
 if(ninjaLimit('easy')!==9||ninjaLimit('medium')!==13||ninjaLimit('hard')!==18)throw new Error('ninja timer');
 if(ninjaLimit('hard')<FALL_SECS.hard||halfPay(1)!==0.5||halfPay(2)!==1||halfPay(3)!==1.5)throw new Error('half');
 if(fmt(12.5)!=='12.5'||fmt(0.5)!=='0.5')throw new Error('fmt half');
 const halfHouse=houseProgress(0.5);if(halfHouse.have!==0.5||halfHouse.next.id!=='foundation')throw new Error('half brick');
 const seenSci={};SCIENCE.forEach(s=>{if(!s.ans||s.wrongs.length<3||s.wrongs.indexOf(s.ans)>=0||new Set([s.ans,...s.wrongs]).size!==s.wrongs.length+1)throw new Error('sci dup '+s.text.slice(0,48));
  if(!s.hint||!s.steps||s.steps.length<2||!B[s.bite])throw new Error('sci link '+s.bite);
  const q=mcQ(s.topic,s.diff,s.text,s.ans,s.wrongs,{bite:s.bite,hint:s.hint,steps:s.steps});
  if(!q||q.choices.indexOf(s.ans)<0||q.reward!==REWARD[s.diff]||q.link.indexOf('https://www.bbc.co.uk/bitesize/')!==0)throw new Error('sci q '+s.text.slice(0,40));
  seenSci[s.topic+'|'+s.diff]=(seenSci[s.topic+'|'+s.diff]||0)+1;});
 ['materials','space','forces','living','humans'].forEach(t=>['easy','medium','hard'].forEach(d=>{if((seenSci[t+'|'+d]||0)<3)throw new Error('sci bank '+t+' '+d);if(!make(t,d))throw new Error('sci make '+t+' '+d);}));
 if(!LEVELS.some(l=>l.tycoon&&l.key==='m2')||!LEVELS.some(l=>l.subject==='science'&&l.mode==='ninja'))throw new Error('levels');
 if(DUEL_DMG.easy!==20||DUEL_DMG.medium!==30||DUEL_DMG.hard!==40)throw new Error('duel dmg');
 if(RANKS[0].id!=='iron3'||RANKS[0].need!==0||RANKS[RANKS.length-1].id!=='legend'||RANKS.length<12)throw new Error('ranks');
 for(let i=1;i<RANKS.length;i++)if(RANKS[i].need<=RANKS[i-1].need||!RANKS[i].color||!RANKS[i].bot||!RANKS[i].hp)throw new Error('rank order');
 if(!RANKS.some(r=>r.bot==='Brickbyte')||!RANKS.some(r=>r.bot==='Nova Cube')||!RANKS.some(r=>r.bot==='Captain Pixel')||!RANKS.some(r=>r.bot==='Star Warden'))throw new Error('bots');
 if(freshDuel().tag!=='Redliss'||duelDamage('easy',true,0)!==10||duelDamage('medium',true,3)!==25||duelDamage('hard',false,3)!==50)throw new Error('duel hit');
 if(duelDamage('hard',false,0,1.9)<=duelDamage('hard',false,0,1))throw new Error('power');
 if(WIN_BONUS!==5||SKINS.some(s=>/rival/i.test(s.name))||FINISHERS.some(s=>/rival/i.test(s.name))||GEAR.some(s=>/rival/i.test(s.name))||RANKS.some(s=>/rival/i.test(s.bot)))throw new Error('duel names');
 if(SKINS.length<8||SKINS.length>12||SKINS[0].cost!==0)throw new Error('skins');
 for(let i=1;i<SKINS.length;i++)if(!(SKINS[i].cost>SKINS[i-1].cost&&SKINS[i].power>SKINS[i-1].power))throw new Error('weapon scale');
 const easyHits=SKINS.map(s=>duelDamage('easy',false,0,s.power));
 for(let i=1;i<easyHits.length;i++)if(easyHits[i]<=easyHits[i-1])throw new Error('easy scale');
 if(!SKINS.some(s=>s.name==='Lava Blaster'&&s.cost>0)||!SKINS.some(s=>s.name==='Galaxy Slingshot'&&s.cost>0))throw new Error('skins');
 if(MM_SECS.easy!==90||MM_SECS.medium!==60||MM_SECS.hard!==30)throw new Error('bomb');
 if(MM_CLEAR.easy!==15||MM_CLEAR.medium!==30||MM_CLEAR.hard!==45)throw new Error('clear');
 const m3=LEVELS.find(l=>l.key==='m3');
 if(!m3||MM_MIX.medium.join(',')!==m3.diffs.join(','))throw new Error('mm mix');
 if(MM_MIX.easy.indexOf('hard')>=0||MM_MIX.hard.indexOf('easy')>=0)throw new Error('mm band');
 if(!GEAR.some(g=>g.id==='shield')||!GEAR.some(g=>g.id==='armour')||!GEAR.some(g=>g.id==='pack')||!GEAR.some(g=>g.id==='boots'))throw new Error('gear');
 if(BADGES.length<5||currentRank(0).id!=='iron3'||currentRank(22).name!=='Gold III'||currentRank(999).id!=='legend')throw new Error('current rank');}
selfTest();
window.__bmq={G,LEVELS,make,buildRound,HOUSE,houseProgress,REWARD,LIMIT,GRACE,FALL_SECS,ninjaLimit,halfPay,TOPICS,toRoman,words,fmt,fr,mixed,money,getQ:()=>Q,answer,nextQ,finish,beginHalf,DUEL_DMG,RANKS,SKINS,FINISHERS,GEAR,BADGES,duelDamage,freshDuel,MM_SECS,MM_CLEAR,MM_MIX,currentRank,weaponPower,player:()=>player};
showStart();
})();
