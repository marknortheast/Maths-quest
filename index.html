<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Block Maths Quest – earn Robux points!</title>
<style>
:root{--ink:#14142b;--sky1:#38bdf8;--sky2:#6366f1;--green:#22c55e;--red:#ef4444;--yellow:#facc15;--blue:#3b82f6;--orange:#f97316;--purple:#a855f7;--card:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Avenir Next","Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,sans-serif;font-weight:700;color:var(--ink);
 background:linear-gradient(160deg,var(--sky1),var(--sky2));min-height:100vh;min-height:100dvh;overflow-x:hidden;
 -webkit-user-select:none;user-select:none;touch-action:manipulation}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
 background-image:linear-gradient(90deg,#fff 2px,transparent 2px),linear-gradient(#fff 2px,transparent 2px);background-size:48px 48px}
button,a.bitelink{font-family:inherit;font-weight:900;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
 background:var(--ink);color:#fff;border-bottom:5px solid #000;min-height:72px}
#hdr .brand{font-size:20px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
#hdr .brand b{color:var(--yellow)}
#hdr .who{display:flex;align-items:center;gap:10px;min-width:0}
#hdr .who .nm{font-size:18px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:3px 10px;border-radius:6px;border:3px solid #000;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:#14142b}
.t-Noob{background:#cbd5e1}.t-Builder{background:#fdba74}.t-Pro{background:#93c5fd}.t-Legend{background:linear-gradient(90deg,#fde047,#f472b6,#a78bfa)}
.spacer{flex:1}
.bank{display:flex;align-items:center;gap:8px;background:#000;border:3px solid var(--yellow);border-radius:10px;padding:4px 12px 4px 6px;font-size:22px;color:var(--yellow)}
.bank.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.25)}100%{transform:scale(1)}}
.hbtn{background:#2a2a4a;color:#fff;border:3px solid #000;border-radius:10px;padding:8px 10px;font-size:15px;box-shadow:0 4px 0 #000;display:flex;align-items:center;gap:6px}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.hbtn svg{width:22px;height:22px}
.coin{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:50%;font-size:.7em;font-weight:900;color:#7a4a00;
 background:radial-gradient(circle at 35% 30%,#fff7b0,#facc15 45%,#d99100);border:3px solid #7a4a00;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex:none;letter-spacing:-.5px}
.coin.big{font-size:28px}
#app{position:relative;max-width:1180px;margin:0 auto;padding:18px 18px 40px}
.card{background:var(--card);border:5px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 var(--ink);padding:20px}
h1,h2,h3{margin:0 0 10px;font-weight:900}
h1{font-size:44px;line-height:1.05;text-transform:uppercase;letter-spacing:1px}
h2{font-size:30px}
h3{font-size:22px}
.muted{color:#55557a;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:4px solid var(--ink);border-radius:12px;box-shadow:0 6px 0 var(--ink);
 padding:14px 22px;font-size:22px;background:var(--yellow);transition:transform .05s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.grey{background:#e2e8f0}
.btn.purple{background:var(--purple);color:#fff}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.start{display:grid;grid-template-columns:300px 1fr;gap:22px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.hero h1{color:#fff;text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink)}
.hero .avatarBox{background:rgba(255,255,255,.25);border:5px solid var(--ink);border-radius:14px;padding:10px 26px;box-shadow:0 8px 0 var(--ink)}
input.name{width:100%;font:inherit;font-size:28px;font-weight:900;padding:12px 14px;border:4px solid var(--ink);border-radius:12px;outline:none;-webkit-user-select:text;user-select:text}
input.name:focus{background:#fffbe6}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:3px solid var(--ink);border-radius:10px;background:#e0f2fe;padding:6px 12px;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.chip.on{background:var(--yellow)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.lvl{text-align:left;border:5px solid var(--ink);border-radius:14px;box-shadow:0 7px 0 var(--ink);padding:14px;color:#fff;min-height:118px;display:flex;flex-direction:column;gap:6px}
.lvl:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.lvl .t{font-size:24px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.lvl .d{font-size:15px;font-weight:700;opacity:.95;line-height:1.3}
.lvl .tag{align-self:flex-start;background:rgba(0,0,0,.3);border-radius:6px;padding:2px 8px;font-size:14px}
.lvl:last-child:nth-child(odd){grid-column:1 / -1}
.l1{background:linear-gradient(135deg,#22c55e,#15803d)}.l2{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.l3{background:linear-gradient(135deg,#f97316,#c2410c)}.l4{background:linear-gradient(135deg,#7c3aed,#4c1d95)}
.l5{background:linear-gradient(135deg,#7f1d1d,#111);border-color:#000}
.l5 .t{color:#fde047}
.err{color:var(--red);font-size:18px;min-height:24px;margin-top:6px}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:12px;color:#fff;flex-wrap:wrap}
.blocks{display:flex;gap:6px}
.blocks i{width:26px;height:26px;border:3px solid var(--ink);border-radius:6px;background:rgba(255,255,255,.35)}
.blocks i.ok{background:var(--green)}.blocks i.no{background:var(--red)}.blocks i.cur{background:var(--yellow);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.tagbox{background:var(--ink);border:3px solid #000;border-radius:10px;padding:6px 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.streak{color:#fdba74}
.quiz{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
.qcard{min-height:280px;display:flex;flex-direction:column;gap:12px}
.qnum{font-size:16px;color:#55557a;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.dpill{border-radius:8px;padding:2px 8px;border:3px solid var(--ink);font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink)}
.d-easy{background:#bbf7d0}.d-medium{background:#fde68a}.d-hard{background:#fecaca}
.qtext{font-size:34px;line-height:1.3;font-weight:900;flex:1;display:flex;align-items:flex-start}
.qtext>span.qi{display:block;width:100%}
.qtext.long{font-size:26px}
.qtext b{color:#1d4ed8}
.qlead{display:block;margin-bottom:8px}
.blank{display:inline-block;min-width:1.4em;border-bottom:4px solid var(--ink);text-align:center;color:#c2410c}
.speed{height:18px;border:4px solid var(--ink);border-radius:8px;background:#e2e8f0;overflow:hidden;position:relative}
.speed span{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#22c55e,#facc15);transform-origin:left;transition:transform .1s linear}
.speedlbl{font-size:15px;color:#55557a;display:flex;justify-content:space-between}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.78em;line-height:1.08;margin:0 .1em}
.frac>span:first-child{border-bottom:.12em solid currentColor;padding:0 .18em}
.mixed{white-space:nowrap}
table.mini{border-collapse:collapse;width:100%;font-size:18px;margin:4px 0 6px;background:#fff}
table.mini th,table.mini td{border:3px solid var(--ink);padding:6px 8px;text-align:center}
table.mini th{background:#dbeafe;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;margin:8px 0;padding:8px 8px 4px;background:#f8fafc;border:3px solid var(--ink);border-radius:10px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:14px;gap:2px}
.bars .col i{display:block;width:100%;max-width:48px;background:#3b82f6;border:3px solid var(--ink);border-bottom:none}
.bars .col span{font-size:16px}
.chartsvg{width:100%;height:auto;max-width:460px;background:#f8fafc;border:3px solid var(--ink);border-radius:10px;display:block}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.choice{min-height:96px;font-size:28px;border:5px solid var(--ink);border-radius:14px;box-shadow:0 7px 0 var(--ink);background:#fff;padding:10px}
.choice:nth-child(1){background:#fde68a}.choice:nth-child(2){background:#bfdbfe}.choice:nth-child(3){background:#bbf7d0}.choice:nth-child(4){background:#fbcfe8}
.choice:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.choice.right{background:var(--green)!important;color:#fff}.choice.wrong{background:var(--red)!important;color:#fff;opacity:.85}
.choice.dim{opacity:.45}
.disp{display:flex;align-items:center;justify-content:center;gap:8px;height:76px;border:5px solid var(--ink);border-radius:14px;background:#fff;font-size:40px;margin-bottom:12px;box-shadow:inset 0 4px 0 rgba(0,0,0,.08)}
.disp .cur{display:inline-block;width:4px;height:40px;background:var(--ink);animation:blink 1s steps(1) infinite}
.disp .aff{color:#55557a;font-size:28px}
@keyframes blink{50%{opacity:0}}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.key{height:64px;font-size:30px;border:4px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);background:#fff}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.key.fn{background:#e2e8f0;font-size:26px}.key.go{background:var(--green);color:#fff;grid-row:span 2;height:auto;font-size:36px}
.helpbtn{width:100%;background:#ede9fe;color:#5b21b6;border:4px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);padding:12px 14px;font-size:20px;text-align:center}
.helpbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.helppanel{background:#f5f3ff;border:4px solid #7c3aed;border-radius:12px;padding:14px}
.helptop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.helppanel h3{margin:8px 0 6px;color:#5b21b6}
.helppanel .hint{font-size:19px;line-height:1.4;background:#fff;border-radius:10px;padding:10px 12px;border:3px dashed #7c3aed}
.helppanel ol{margin:6px 0 10px 22px;padding:0;font-size:18px;line-height:1.45}
.helppanel li{margin:0 0 6px}
.bitelink{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:#111827;color:#fff!important;border:4px solid #000;border-radius:12px;box-shadow:0 5px 0 #000;padding:12px 14px;font-size:18px;margin:8px 0}
.bitelink:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.fb{border:5px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 var(--ink);padding:18px;animation:slide .25s ease-out}
@keyframes slide{from{transform:translateY(20px);opacity:0}}
.fb.good{background:#dcfce7}.fb.bad{background:#fff7ed}
.fb h2{font-size:32px;margin-bottom:6px}
.fb.good h2{color:#15803d}.fb.bad h2{color:#c2410c}
.fb .ex{font-size:19px;line-height:1.45;font-weight:700;margin:8px 0 14px}
.bon{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.bon span{background:var(--ink);color:var(--yellow);border-radius:8px;padding:5px 10px;font-size:18px}
.ansbig{font-size:28px;font-weight:900}
.center{text-align:center}
.score{font-size:72px;line-height:1;margin:6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:20px}
.tbl td,.tbl th{padding:9px 10px;border-bottom:3px solid #e2e8f0;text-align:left}
.tbl th{font-size:16px;text-transform:uppercase;color:#55557a}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.tot td{border-top:4px solid var(--ink);font-size:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.unlock{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#fef9c3,#fde68a);border:4px solid var(--ink);border-radius:12px;padding:10px 14px;margin:8px 0;animation:slide .4s}
.unlock .u{font-size:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.stat{background:#fff;border:4px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);padding:12px;text-align:center}
.stat .v{font-size:30px;display:flex;align-items:center;justify-content:center;gap:8px}
.stat .k{font-size:14px;color:#55557a;text-transform:uppercase}
.badges{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.badge{border:4px solid var(--ink);border-radius:12px;padding:10px 6px;text-align:center;background:linear-gradient(#fef3c7,#fde68a);box-shadow:0 5px 0 var(--ink)}
.badge.locked{background:#e2e8f0;filter:grayscale(1);opacity:.7}
.badge .amt{font-size:18px;display:flex;justify-content:center;align-items:center;gap:6px}
.badge .bn{font-size:14px;margin-top:4px}.badge .bs{font-size:13px;color:#55557a;margin-top:2px}
.prog{height:26px;border:4px solid var(--ink);border-radius:10px;background:#e2e8f0;overflow:hidden;margin:8px 0}
.prog span{display:block;height:100%;background:repeating-linear-gradient(45deg,#facc15 0 14px,#f59e0b 14px 28px)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:4px solid var(--ink);border-radius:12px;background:#fff;padding:6px;box-shadow:0 4px 0 var(--ink);position:relative;min-width:72px;text-align:center;font-size:13px}
.opt.sel{background:var(--yellow)}
.opt.locked{opacity:.4}
.opt .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.sw{width:56px;height:56px;border-radius:6px;border:3px solid var(--ink);margin:0 auto}
.bar{height:18px;background:#e2e8f0;border:3px solid var(--ink);border-radius:6px;overflow:hidden;min-width:100px}
.bar span{display:block;height:100%}
textarea{width:100%;font:inherit;font-size:20px;padding:10px;border:4px solid var(--ink);border-radius:12px;min-height:80px;-webkit-user-select:text;user-select:text}
.note{background:#eff6ff;border:4px dashed #1d4ed8;border-radius:12px;padding:12px 14px;font-size:18px;line-height:1.4;margin:12px 0}
.sitebar{display:flex;gap:12px;align-items:center;background:#fff;border:4px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:12px;box-shadow:0 5px 0 var(--ink)}
.sitebar svg{height:86px;width:auto;flex:none}
.sitebar .ht{flex:1;min-width:0}
.sitebar .ht b{font-size:18px}
.sitebar .ht p{margin:2px 0 0;font-size:15px;color:#55557a}
.housepage{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
.housesvg{width:100%;height:auto;display:block;background:#7dd3fc;border-radius:12px}
.stlist{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto;-webkit-overflow-scrolling:touch}
.st{display:flex;justify-content:space-between;gap:8px;align-items:center;border:3px solid var(--ink);border-radius:10px;padding:8px 10px;background:#f8fafc;font-size:16px}
.st.done{background:#dcfce7}
.st.now{background:#fef9c3}
.st .need{color:#55557a;font-size:14px}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .6s ease-out;transform-box:fill-box;transform-origin:center bottom}
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,30,.6);display:flex;align-items:center;justify-content:center;padding:20px}
#modal .card{max-width:520px;width:100%;text-align:center}
#modal p{font-size:20px;line-height:1.4}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx .coin{position:absolute;left:0;top:0;font-size:22px}
.floattxt{position:absolute;font-size:28px;font-weight:900;color:var(--yellow);text-shadow:0 3px 0 #000,2px 0 0 #000,-2px 0 0 #000}
.confetti{position:absolute;left:0;top:0;width:14px;height:14px;border:2px solid #000}
@media (max-width:900px){
 .start,.quiz,.grid2,.housepage{grid-template-columns:1fr!important}
 .badges{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:1fr 1fr}
 h1{font-size:34px}.qtext{font-size:28px}.qtext.long{font-size:22px}
 #hdr .brand{display:none}
 .hbtn .lbl{display:none}
 .sitebar svg{height:72px}
}
@media (max-width:560px){.levels{grid-template-columns:1fr}.choice{font-size:22px;min-height:80px}.lvl:last-child:nth-child(odd){grid-column:auto}}
</style>

<body>
<header id="hdr"></header>
<main id="app"></main>
<div id="modal" class="hidden"></div>
<div id="fx"></div>
<script>
(function(){
"use strict";
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const clean=x=>+(+x).toFixed(6);
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fmt=n=>{const s=Math.abs(n).toLocaleString('en-GB',{maximumFractionDigits:3});return (n<0?'−':'')+s;};
const money=n=>'S$'+((+n).toFixed(2));
const fr=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const mixed=(w,n,d)=>`<span class="mixed">${w}${fr(n,d)}</span>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const COIN='<span class="coin">R$</span>';
const $=s=>document.querySelector(s);
const REWARD={easy:1,medium:2,hard:3};
const DNAME={easy:'Easy',medium:'Medium',hard:'Hard'};

const KEY='blockMathsQuest_v1';
let store={players:{},last:'',muted:false};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.players)store=Object.assign(store,s);}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
load();
function newPlayer(name){return{name,total:0,rounds:0,correct:0,answered:0,bestStreak:0,history:[],topics:{},av:{hat:'none',shirt:'green'},seen:[],note:'',house:{pts:0},economy:'v2'};}
function migrate(p){if(!p)return;if(!p.house||typeof p.house.pts!=='number')p.house={pts:0};if(!p.av)p.av={hat:'none',shirt:'green'};if(!p.topics)p.topics={};if(!p.history)p.history=[];if(!p.seen)p.seen=[];}
let player=null;
function setPlayer(name){const k=name.trim().toLowerCase();if(!store.players[k])store.players[k]=newPlayer(name.trim());player=store.players[k];migrate(player);store.last=k;save();}
if(store.last&&store.players[store.last]){player=store.players[store.last];migrate(player);}

const SHIRTS={green:'#22c55e',red:'#ef4444',blue:'#3b82f6',orange:'#f97316',purple:'#a855f7',lime:'#a3e635',gold:'#facc15',rainbow:'rainbow'};
const HATS={none:'No hat',cap:'Baseball cap',hardhat:'Builder helmet',headphones:'Gamer headphones',crown:'Pro crown',halo:'Legend halo',shades:'Cool shades'};
const MILESTONES=[
 {at:8,name:'First Bricks',hats:['cap'],shirts:['blue']},
 {at:20,name:'Builder',hats:['hardhat'],shirts:['orange']},
 {at:40,name:'On a Roll',hats:['headphones'],shirts:['purple','lime']},
 {at:80,name:'Pro Player',hats:['crown'],shirts:['gold']},
 {at:150,name:'Legend',hats:['halo'],shirts:['rainbow']},
 {at:300,name:'Mega Saver',hats:['shades'],shirts:[]}
];
const titleFor=t=>t>=150?'Legend':t>=80?'Pro':t>=20?'Builder':'Noob';
function scaleEconomy(p){if(!p||p.economy==='v2')return;p.total=Math.round((p.total||0)/10);(p.history||[]).forEach(h=>{h.earned=Math.max(0,Math.round((h.earned||0)/10));});p.seen=MILESTONES.filter(m=>p.total>=m.at).map(m=>m.at);p.economy='v2';}

function subWork(a,b){const len=String(a).length;const A=String(a).padStart(len,'0').split('').map(Number);const B=String(b).padStart(len,'0').split('').map(Number);const lines=[];const digits=[];
 for(let i=len-1;i>=0;i--){const place=PV[len-1-i]||'column';
  if(A[i]<B[i]){let j=i-1;while(j>=0&&A[j]===0)j--;if(j<0)return null;lines.push(place+': '+A[i]+' is smaller than '+B[i]+', so exchange 1 from the left. That digit becomes '+(A[i]+10)+'.');A[j]--;for(let k=j+1;k<i;k++)A[k]=9;A[i]+=10;}
  const d=A[i]-B[i];digits[i]=d;lines.push(place+': '+A[i]+' − '+B[i]+' = '+d+'.');A[i]=d;}
 const val=digits.reduce((s,d)=>s*10+d,0);return {lines,val};}
function addWork(a,b){const len=Math.max(String(a).length,String(b).length);const A=String(a).padStart(len,'0').split('').map(Number);const B=String(b).padStart(len,'0').split('').map(Number);let carry=0;const lines=[];const digits=[];

 if(carry){lines.push('The last carry is '+carry+', so it goes at the front.');digits.unshift(carry);}
 return {lines,val:digits.reduce((s,d)=>s*10+d,0)};}

G.money=diff=>{const hard=diff==='hard',med=diff==='medium';const v=R(0,2);

G.word=diff=>{const hard=diff==='hard',med=diff==='medium';const v=R(0,4);

 if(v===2){const a=R(3,9),b=R(2,6),c=R(4,12);const ans=a*b+c;return numQ('word',diff,'A tycoon dropper makes <b>'+a+'</b> coins on each of <b>'+b+'</b> floors, and you already have <b>'+c+'</b> coins. How many coins do you have now?',ans,{bite:'solve',long:true,hint:'Multiply the coins by the number of floors first, then add the coins you already had.',steps:[a+' × '+b+' = '+(a*b)+'.','Then add '+c+': '+(a*b)+' + '+c+' = '+ans+'.',end(String(ans))],audit:{op:'chainMul',a,b,c}});}
 if(v===3){const price=pick([3,4,5,6]),n=R(hard?8:4,hard?20:12);return numQ('word',diff,'Stickers cost <b>S$'+price+'</b> each. How much do <b>'+n+'</b> stickers cost?',price*n,{bite:'solve',prefix:'S$',long:true,hint:'Same price, several items: multiply. You can split the bigger number into tens and ones if that helps.',steps:[n+' × '+price+' = '+(n*price)+'.',end(money(n*price))],audit:{op:'mul',a:price,b:n}});}

G.scaling=diff=>{const hard=diff==='hard',med=diff==='medium';const v=R(0,2);

 if(v===1){const from=hard?pick([6,8,9,12]):pick([4,6,8]);const to=pick([2,3,4].filter(t=>from%t===0&&t<from));const base=from*R(15,60);

function make(topic,diff){for(let i=0;i<60;i++){let q;try{q=G[topic](diff);}catch(e){q=null;}
 if(!q||q.diff!==diff||q.reward!==REWARD[diff])continue;
 if(!q.hint||!q.steps||q.steps.length<2)continue;
 if(!q.link||q.link.indexOf('https://www.bbc.co.uk/bitesize/')!==0)continue;
 if(q.type==='num'&&!isFinite(q.ans))continue;
 if(q.type==='mc'&&(!q.choices||q.choices.length<4||q.choices.indexOf(q.ans)<0))continue;
 if(q.type==='mc'&&new Set(q.choices).size!==q.choices.length)continue;
 return q;}return null;}

function buildRound(L){const bag=[];for(const t in L.topics)for(let i=0;i<L.topics[t];i++)bag.push(t);

 while(qs.length<10&&g++<700){const t=pick(bag);const q=make(t,pick(L.diffs));if(!q||seen.has(q.text))continue;

 const rows=Object.keys(TOPICS).filter(t=>p.topics[t]).map(t=>{const s=p.topics[t],a=Math.round(s.c/s.n*100);return `<tr><td>${TOPICS[t]}</td><td class="r">${s.c}/${s.n}</td><td><div class="bar"><span style="width:${a}%;background:${a>=80?'#22c55e':a>=50?'#facc15':'#ef4444'}"></span></div></td><td class="r">${a}%</td></tr>`;}).join('');
 app.innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">👪 Parent area · ${esc(p.name)}</h2><div class="spacer"></div><button class="btn grey" data-act="home">Back</button></div>
 <div class="note"><b>Please note:</b> R$ here are <b>practice points only</b>. They are not real Robux and this game has no link to Roblox. A correct answer is worth <b>1 R$</b> (easy), <b>2 R$</b> (medium) or <b>3 R$</b> (hard). You decide whether to swap them for a real treat. Nothing is bought, no ads are shown and no data leaves this device.</div>
 <div class="stats"><div class="stat"><div class="v"><span class="coin big">R$</span>${fmt(p.total)}</div><div class="k">Total earned</div></div><div class="stat"><div class="v">${p.rounds}</div><div class="k">Rounds played</div></div>
 <div class="stat"><div class="v">${acc}%</div><div class="k">Overall accuracy</div></div><div class="stat"><div class="v">🏠 ${st.built.length}/${HOUSE.length}</div><div class="k">House parts</div></div></div>
 <div class="grid2"><div><h3>Accuracy by topic</h3>${rows?`<table class="tbl" style="font-size:16px"><tr><th>Topic</th><th class="r">Right</th><th></th><th class="r">%</th></tr>${rows}</table>`:'<p class="muted">No answers yet.</p>'}</div>
 <div><h3>Exchange note (optional)</h3><p class="muted" style="margin-top:-4px">Write your house rule. With the new 1–3 point prizes, a small treat might be about 15–20 R$.</p>
  <textarea id="note" maxlength="300" placeholder="e.g. 20 points = one small treat on Saturday">${esc(p.note||'')}</textarea>
  <div class="row" style="margin-top:10px"><button class="btn green" data-act="savenote">Save note</button></div>
  ${p.note?`<div class="note" style="background:#fefce8;border-color:#ca8a04">Current deal: <b>${esc(p.note)}</b></div>`:''}
  <p class="muted" style="font-size:16px;margin-top:14px;line-height:1.4">Questions follow the England Year 5 maths curriculum, which matches a Singapore international school Year 5. The house build is saved in this browser with the score.</p></div></div></div>`;}
function confirmReset(){if(!player)return;const m=$('#modal');m.classList.remove('hidden');
 m.innerHTML=`<div class="card"><h2>Reset ${esc(player.name)}'s bank?</h2><p>This wipes <b>all ${fmt(player.total)} R$</b>, the house build, the history, badges and unlocks for ${esc(player.name)}. It cannot be undone.</p><div class="row" style="justify-content:center"><button class="btn grey" data-act="cancelreset">Cancel</button><button class="btn red" data-act="doreset">Yes, reset</button></div></div>`;}
function closeModal(){const m=$('#modal');m.classList.add('hidden');m.innerHTML='';}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;if(el.tagName!=='A')actx();const a=el.dataset.act;
 switch(a){
  case 'home':closeModal();showStart();break;
  case 'pickname':{const k=el.dataset.n.trim().toLowerCase();if(store.players[k]){player=store.players[k];migrate(player);store.last=k;save();}sfx.click();showStart();break;}
  case 'level':startRound(el.dataset.l);break;
  case 'again':newRound(LEVELS.find(l=>l.id===+el.dataset.l));sfx.click();showQ();break;
  case 'choose':if(Q&&!Q.locked){answer(Q.qs[Q.i].choices[+el.dataset.k],el);}break;
  case 'key':keyIn(el.dataset.k);break;
  case 'help':toggleHelp();break;
  case 'closehelp':toggleHelp();break;
  case 'next':nextQ();break;
  case 'house':showHouse();break;
  case 'bank':showBank();break;
  case 'rewards':showRewards();break;
  case 'parent':showParent();break;
  case 'mute':store.muted=!store.muted;save();header();if(!store.muted)sfx.click();break;
  case 'hat':player.av.hat=el.dataset.h;save();sfx.click();showRewards();break;
  case 'shirt':player.av.shirt=el.dataset.s;save();sfx.click();showRewards();break;
  case 'savenote':player.note=($('#note').value||'').trim();save();sfx.coin();showParent();break;
  case 'reset':confirmReset();break;
  case 'cancelreset':closeModal();break;
  case 'doreset':{const k=player.name.trim().toLowerCase();store.players[k]=newPlayer(player.name);player=store.players[k];save();closeModal();showBank();break;}
 }});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')){if(e.key==='Enter'&&t.id==='nm'){e.preventDefault();t.blur();}return;}
 if(!Q)return;const q=Q.qs[Q.i];
 if(Q.locked){if(e.key==='Enter'||e.key===' '){e.preventDefault();nextQ();}return;}
 if(q.type==='mc'){const k=+e.key;if(k>=1&&k<=q.choices.length){const b=document.querySelector(`.choice[data-k="${k-1}"]`);if(b)b.click();}return;}
 if(/^[0-9]$/.test(e.key))keyIn(e.key);else if(e.key==='Backspace'){e.preventDefault();keyIn('del');}else if(e.key==='-')keyIn('-');else if(e.key==='.')keyIn('.');else if(e.key==='Enter')keyIn('ok');});

function selfTest(){const roman={1:'I',4:'IV',9:'IX',14:'XIV',40:'XL',49:'XLIX',58:'LVIII',90:'XC',99:'XCIX',400:'CD',444:'CDXLIV',900:'CM',999:'CMXCIX',1000:'M'};
 for(const k in roman)if(toRoman(+k)!==roman[k])throw new Error('roman '+k+' '+toRoman(+k));
 const wc=[[21,'twenty-one'],[100,'one hundred'],[101,'one hundred and one'],[115,'one hundred and fifteen'],[1000,'one thousand'],[1001,'one thousand and one'],[1100,'one thousand, one hundred'],[2150,'two thousand, one hundred and fifty'],[20000,'twenty thousand'],[100000,'one hundred thousand'],[101000,'one hundred and one thousand']];
 for(const [n,w] of wc)if(words(n)!==w)throw new Error('words '+n+' got '+words(n));
 for(let i=0;i<80;i++){const a=R(20,99999),b=R(1,a-1);const w=subWork(a,b);if(!w||w.val!==a-b)throw new Error('sub '+a+' '+b);const u=addWork(a,b);if(!u||u.val!==a+b)throw new Error('add '+a+' '+b);}
 const hp=houseProgress(0);if(hp.built.length!==1||hp.next.id!=='foundation')throw new Error('house start');
 const full=HOUSE.reduce((s,x)=>s+x.cost,0);if(!houseProgress(full).done)throw new Error('house done');
 if(houseProgress(full-1).done)throw new Error('house early');}
selfTest();
window.__bmq={G,LEVELS,make,buildRound,HOUSE,houseProgress,REWARD,TOPICS,toRoman,words,fmt,fr,mixed,money};
showStart();
})();
