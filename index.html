<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Block Maths Quest – earn Robux points!</title>
<style>
:root{--ink:#14142b;--sky1:#38bdf8;--sky2:#6366f1;--green:#22c55e;--red:#ef4444;--yellow:#facc15;--blue:#3b82f6;--orange:#f97316;--purple:#a855f7;--card:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Avenir Next","Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,sans-serif;font-weight:700;color:var(--ink);
 background:linear-gradient(160deg,var(--sky1),var(--sky2));min-height:100vh;min-height:100dvh;overflow-x:hidden;
 -webkit-user-select:none;user-select:none;touch-action:manipulation}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
 background-image:linear-gradient(90deg,#fff 2px,transparent 2px),linear-gradient(#fff 2px,transparent 2px);background-size:48px 48px}
button{font-family:inherit;font-weight:900;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));
 background:var(--ink);color:#fff;border-bottom:5px solid #000;min-height:72px}
#hdr .brand{font-size:22px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
#hdr .brand b{color:var(--yellow)}
#hdr .who{display:flex;align-items:center;gap:10px;min-width:0}
#hdr .who .nm{font-size:20px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:3px 10px;border-radius:6px;border:3px solid #000;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:#14142b}
.t-Noob{background:#cbd5e1}.t-Builder{background:#fdba74}.t-Pro{background:#93c5fd}.t-Legend{background:linear-gradient(90deg,#fde047,#f472b6,#a78bfa)}
.spacer{flex:1}
.bank{display:flex;align-items:center;gap:8px;background:#000;border:3px solid var(--yellow);border-radius:10px;padding:4px 12px 4px 6px;font-size:24px;color:var(--yellow)}
.bank.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.25)}100%{transform:scale(1)}}
.hbtn{background:#2a2a4a;color:#fff;border:3px solid #000;border-radius:10px;padding:8px 12px;font-size:16px;box-shadow:0 4px 0 #000;display:flex;align-items:center;gap:6px}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.hbtn svg{width:22px;height:22px}
.coin{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:50%;font-size:.7em;font-weight:900;color:#7a4a00;
 background:radial-gradient(circle at 35% 30%,#fff7b0,#facc15 45%,#d99100);border:3px solid #7a4a00;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex:none;letter-spacing:-.5px}
.coin.big{font-size:28px}
#app{position:relative;max-width:1180px;margin:0 auto;padding:18px 18px 40px}
.card{background:var(--card);border:5px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 var(--ink);padding:20px}
h1,h2,h3{margin:0 0 10px;font-weight:900}
h1{font-size:44px;line-height:1.05;text-transform:uppercase;letter-spacing:1px}
h2{font-size:30px}
.muted{color:#55557a;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:4px solid var(--ink);border-radius:12px;box-shadow:0 6px 0 var(--ink);
 padding:14px 22px;font-size:22px;background:var(--yellow);transition:transform .05s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.grey{background:#e2e8f0}
.btn.purple{background:var(--purple);color:#fff}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.start{display:grid;grid-template-columns:330px 1fr;gap:22px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.hero h1{color:#fff;text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink)}
.hero .avatarBox{background:rgba(255,255,255,.25);border:5px solid var(--ink);border-radius:14px;padding:10px 26px;box-shadow:0 8px 0 var(--ink)}
input.name{width:100%;font:inherit;font-size:28px;font-weight:900;padding:12px 14px;border:4px solid var(--ink);border-radius:12px;outline:none;-webkit-user-select:text;user-select:text}
input.name:focus{background:#fffbe6}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:3px solid var(--ink);border-radius:10px;background:#e0f2fe;padding:6px 12px;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.chip.on{background:var(--yellow)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.lvl{text-align:left;border:5px solid var(--ink);border-radius:14px;box-shadow:0 7px 0 var(--ink);padding:16px;color:#fff;min-height:132px;display:flex;flex-direction:column;gap:6px}
.lvl:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.lvl .t{font-size:26px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.lvl .d{font-size:16px;font-weight:700;opacity:.95;line-height:1.3}
.lvl .tag{align-self:flex-start;background:rgba(0,0,0,.3);border-radius:6px;padding:2px 8px;font-size:14px}
.l1{background:linear-gradient(135deg,#22c55e,#15803d)}.l2{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.l3{background:linear-gradient(135deg,#f97316,#c2410c)}.l4{background:linear-gradient(135deg,#7f1d1d,#111);border-color:#000}
.l4 .t{color:#fde047}
.err{color:var(--red);font-size:18px;min-height:24px;margin-top:6px}
.qtop{display:flex;align-items:center;gap:14px;margin-bottom:14px;color:#fff;flex-wrap:wrap}
.blocks{display:flex;gap:6px}
.blocks i{width:30px;height:30px;border:3px solid var(--ink);border-radius:6px;background:rgba(255,255,255,.35)}
.blocks i.ok{background:var(--green)}.blocks i.no{background:var(--red)}.blocks i.cur{background:var(--yellow);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.tagbox{background:var(--ink);border:3px solid #000;border-radius:10px;padding:6px 12px;font-size:20px;display:flex;align-items:center;gap:8px}
.streak{color:#fdba74}
.quiz{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:start}
.qcard{min-height:330px;display:flex;flex-direction:column;gap:14px}
.qnum{font-size:18px;color:#55557a;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;gap:10px}
.qtext{font-size:38px;line-height:1.3;font-weight:900;flex:1;display:flex;align-items:center}
.qtext>span.qi{display:block}
.qtext.long{font-size:28px}
.qtext b{color:#1d4ed8}
.blank{display:inline-block;min-width:1.4em;border-bottom:4px solid var(--ink);text-align:center;color:#c2410c}
.speed{height:22px;border:4px solid var(--ink);border-radius:8px;background:#e2e8f0;overflow:hidden;position:relative}
.speed span{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#22c55e,#facc15);transform-origin:left;transition:transform .1s linear}
.speedlbl{font-size:15px;color:#55557a;display:flex;justify-content:space-between}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.78em;line-height:1.08;margin:0 .1em}
.frac>span:first-child{border-bottom:.12em solid currentColor;padding:0 .18em}
.mixed{white-space:nowrap}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.choice{min-height:110px;font-size:32px;border:5px solid var(--ink);border-radius:14px;box-shadow:0 7px 0 var(--ink);background:#fff;padding:10px}
.choice:nth-child(1){background:#fde68a}.choice:nth-child(2){background:#bfdbfe}.choice:nth-child(3){background:#bbf7d0}.choice:nth-child(4){background:#fbcfe8}
.choice:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.choice.right{background:var(--green)!important;color:#fff}.choice.wrong{background:var(--red)!important;color:#fff;opacity:.85}
.choice.dim{opacity:.45}
.disp{display:flex;align-items:center;justify-content:center;gap:8px;height:84px;border:5px solid var(--ink);border-radius:14px;background:#fff;font-size:44px;margin-bottom:12px;box-shadow:inset 0 4px 0 rgba(0,0,0,.08)}
.disp .cur{display:inline-block;width:4px;height:44px;background:var(--ink);animation:blink 1s steps(1) infinite}
.disp .aff{color:#55557a;font-size:32px}
@keyframes blink{50%{opacity:0}}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.key{height:70px;font-size:32px;border:4px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);background:#fff}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.key.fn{background:#e2e8f0;font-size:28px}.key.go{background:var(--green);color:#fff;grid-row:span 2;height:auto;font-size:40px}
.fb{border:5px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 var(--ink);padding:18px;animation:slide .25s ease-out}
@keyframes slide{from{transform:translateY(20px);opacity:0}}
.fb.good{background:#dcfce7}.fb.bad{background:#fff7ed}
.fb h2{font-size:34px;margin-bottom:6px}
.fb.good h2{color:#15803d}.fb.bad h2{color:#c2410c}
.fb .ex{font-size:21px;line-height:1.45;font-weight:700;margin:8px 0 14px}
.bon{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.bon span{background:var(--ink);color:var(--yellow);border-radius:8px;padding:5px 10px;font-size:19px}
.ansbig{font-size:30px;font-weight:900}
.center{text-align:center}
.score{font-size:80px;line-height:1;margin:6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:20px}
.tbl td,.tbl th{padding:9px 10px;border-bottom:3px solid #e2e8f0;text-align:left}
.tbl th{font-size:16px;text-transform:uppercase;color:#55557a}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.tot td{border-top:4px solid var(--ink);font-size:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.unlock{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#fef9c3,#fde68a);border:4px solid var(--ink);border-radius:12px;padding:10px 14px;margin:8px 0;animation:slide .4s}
.unlock .u{font-size:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border:4px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);padding:12px;text-align:center}
.stat .v{font-size:34px;display:flex;align-items:center;justify-content:center;gap:8px}
.stat .k{font-size:15px;color:#55557a;text-transform:uppercase}
.badges{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.badge{border:4px solid var(--ink);border-radius:12px;padding:10px 6px;text-align:center;background:linear-gradient(#fef3c7,#fde68a);box-shadow:0 5px 0 var(--ink)}
.badge.locked{background:#e2e8f0;filter:grayscale(1);opacity:.7}
.badge .amt{font-size:20px;display:flex;justify-content:center;align-items:center;gap:6px}
.badge .bn{font-size:15px;margin-top:4px}.badge .bs{font-size:13px;color:#55557a;margin-top:2px}
.prog{height:28px;border:4px solid var(--ink);border-radius:10px;background:#e2e8f0;overflow:hidden;margin:8px 0}
.prog span{display:block;height:100%;background:repeating-linear-gradient(45deg,#facc15 0 14px,#f59e0b 14px 28px)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:4px solid var(--ink);border-radius:12px;background:#fff;padding:6px;box-shadow:0 4px 0 var(--ink);position:relative;min-width:72px;text-align:center;font-size:13px}
.opt.sel{background:var(--yellow)}
.opt.locked{opacity:.4}
.opt .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.sw{width:56px;height:56px;border-radius:6px;border:3px solid var(--ink);margin:0 auto}
.bar{height:18px;background:#e2e8f0;border:3px solid var(--ink);border-radius:6px;overflow:hidden;min-width:120px}
.bar span{display:block;height:100%}
textarea{width:100%;font:inherit;font-size:20px;padding:10px;border:4px solid var(--ink);border-radius:12px;min-height:80px;-webkit-user-select:text;user-select:text}
.note{background:#eff6ff;border:4px dashed #1d4ed8;border-radius:12px;padding:12px 14px;font-size:18px;line-height:1.4;margin:12px 0}
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,30,.6);display:flex;align-items:center;justify-content:center;padding:20px}
#modal .card{max-width:520px;width:100%;text-align:center}
#modal p{font-size:20px;line-height:1.4}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx .coin{position:absolute;left:0;top:0;font-size:22px}
.floattxt{position:absolute;font-size:30px;font-weight:900;color:var(--yellow);text-shadow:0 3px 0 #000,2px 0 0 #000,-2px 0 0 #000}
.confetti{position:absolute;left:0;top:0;width:14px;height:14px;border:2px solid #000}
@media (max-width:900px){
 .start,.quiz,.grid2{grid-template-columns:1fr!important}
 .badges{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:1fr 1fr}
 h1{font-size:34px}.qtext{font-size:30px}.qtext.long{font-size:24px}
 #hdr .brand{display:none}
 .hbtn .lbl{display:none}
}
@media (max-width:560px){.levels{grid-template-columns:1fr}.choice{font-size:26px;min-height:90px}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<div id="modal" class="hidden"></div>
<div id="fx"></div>
<script>
(function(){
"use strict";
/* ============ utilities ============ */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const clean=x=>+(+x).toFixed(6);
const gcd=(a,b)=>b?gcd(b,a%b):a; const lcm=(a,b)=>a*b/gcd(a,b);
const fmt=n=>{const s=Math.abs(n).toLocaleString('en-GB',{maximumFractionDigits:3});return (n<0?'−':'')+s;};
const money=n=>'S$'+(+n).toFixed(2);
const fr=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const mixed=(w,n,d)=>`<span class="mixed">${w}${fr(n,d)}</span>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const COIN='<span class="coin">R$</span>';
const $=s=>document.querySelector(s);

/* ============ storage (this device only) ============ */
const KEY='blockMathsQuest_v1';
let store={players:{},last:'',muted:false};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.players)store=Object.assign(store,s);}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
load();
function newPlayer(name){return{name,total:0,rounds:0,correct:0,answered:0,bestStreak:0,history:[],topics:{},av:{hat:'none',shirt:'green'},seen:[],note:''};}
let player=null;
function setPlayer(name){const k=name.trim().toLowerCase();if(!store.players[k])store.players[k]=newPlayer(name.trim());player=store.players[k];store.last=k;save();}
if(store.last&&store.players[store.last])player=store.players[store.last];

/* ============ milestones / unlocks ============ */
const SHIRTS={green:'#22c55e',red:'#ef4444',blue:'#3b82f6',orange:'#f97316',purple:'#a855f7',lime:'#a3e635',gold:'#facc15',rainbow:'rainbow'};
const HATS={none:'No hat',cap:'Baseball cap',hardhat:'Builder helmet',headphones:'Gamer headphones',crown:'Pro crown',halo:'Legend halo',shades:'Cool shades'};
const MILESTONES=[
 {at:100,name:'First Hundred',hats:['cap'],shirts:['blue']},
 {at:250,name:'Builder',hats:['hardhat'],shirts:['orange']},
 {at:500,name:'High Five Hundred',hats:['headphones'],shirts:['purple','lime']},
 {at:1000,name:'Pro Player',hats:['crown'],shirts:['gold']},
 {at:2500,name:'Legend',hats:['halo'],shirts:['rainbow']},
 {at:5000,name:'Mega Saver',hats:['shades'],shirts:[]}
];
const titleFor=t=>t>=2500?'Legend':t>=1000?'Pro':t>=250?'Builder':'Noob';
function unlocked(t){const h=['none'],s=['green','red'];MILESTONES.forEach(m=>{if(t>=m.at){h.push(...m.hats);s.push(...m.shirts);}});return{hats:h,shirts:s};}

/* ============ blocky avatar (SVG, original artwork) ============ */
let gid=0;
function avatar(av,size){av=av||{hat:'none',shirt:'green'};const id='g'+(++gid);const sc=SHIRTS[av.shirt]||SHIRTS.green;
 const fill=sc==='rainbow'?`url(#${id})`:sc;const skin='#f6c744',ink='#14142b';
 let hat='';
 switch(av.hat){
  case 'cap':hat=`<rect x="28" y="4" width="44" height="14" rx="3" fill="#ef4444" stroke="${ink}" stroke-width="3"/><rect x="60" y="13" width="26" height="6" rx="2" fill="#b91c1c" stroke="${ink}" stroke-width="3"/>`;break;
  case 'hardhat':hat=`<rect x="28" y="2" width="44" height="16" rx="7" fill="#facc15" stroke="${ink}" stroke-width="3"/><rect x="22" y="15" width="56" height="6" rx="2" fill="#f59e0b" stroke="${ink}" stroke-width="3"/><rect x="47" y="3" width="6" height="12" fill="#f59e0b"/>`;break;
  case 'headphones':hat=`<path d="M26 30 V18 Q50 -6 74 18 V30" fill="none" stroke="${ink}" stroke-width="6"/><rect x="18" y="24" width="12" height="18" rx="3" fill="#22d3ee" stroke="${ink}" stroke-width="3"/><rect x="70" y="24" width="12" height="18" rx="3" fill="#22d3ee" stroke="${ink}" stroke-width="3"/>`;break;
  case 'crown':hat=`<polygon points="30,18 30,2 40,10 50,0 60,10 70,2 70,18" fill="#facc15" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/><rect x="45" y="9" width="10" height="7" fill="#ef4444" stroke="${ink}" stroke-width="2"/>`;break;
  case 'halo':hat=`<ellipse cx="50" cy="5" rx="24" ry="5" fill="none" stroke="#fde047" stroke-width="5"/>`;break;
  case 'shades':hat=`<rect x="31" y="21" width="17" height="9" rx="2" fill="${ink}"/><rect x="52" y="21" width="17" height="9" rx="2" fill="${ink}"/><rect x="46" y="23" width="8" height="3" fill="${ink}"/><rect x="34" y="23" width="5" height="2" fill="#fff"/><rect x="55" y="23" width="5" height="2" fill="#fff"/>`;break;
 }
 const eyes=av.hat==='shades'?'':`<rect x="38" y="22" width="7" height="8" fill="${ink}"/><rect x="55" y="22" width="7" height="8" fill="${ink}"/>`;
 return `<svg viewBox="0 0 100 140" width="${Math.round(size*100/140)}" height="${size}" aria-hidden="true">
 <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset=".25" stop-color="#facc15"/><stop offset=".5" stop-color="#22c55e"/><stop offset=".75" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
 ${av.hat==='halo'?`<circle cx="50" cy="70" r="48" fill="#fde047" opacity=".35"/>`:''}
 <rect x="8" y="50" width="16" height="42" rx="2" fill="${skin}" stroke="${ink}" stroke-width="3"/>
 <rect x="76" y="50" width="16" height="42" rx="2" fill="${skin}" stroke="${ink}" stroke-width="3"/>
 <rect x="25" y="48" width="50" height="46" rx="2" fill="${fill}" stroke="${ink}" stroke-width="3"/>
 <rect x="25" y="94" width="24" height="42" rx="2" fill="#2563eb" stroke="${ink}" stroke-width="3"/>
 <rect x="51" y="94" width="24" height="42" rx="2" fill="#2563eb" stroke="${ink}" stroke-width="3"/>
 <rect x="40" y="42" width="20" height="8" fill="${skin}" stroke="${ink}" stroke-width="3"/>
 <rect x="30" y="10" width="40" height="34" rx="5" fill="${skin}" stroke="${ink}" stroke-width="3"/>
 ${eyes}<path d="M40 35 Q50 42 60 35" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>
 ${hat}</svg>`;}

/* ============ sound (generated with WebAudio, no files) ============ */
let ac=null;
function actx(){if(store.muted)return null;try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();}if(ac.state==='suspended')ac.resume();}catch(e){return null;}return ac;}
function tone(f,at,dur,type,vol,slide){const c=actx();if(!c)return;const t=c.currentTime+at;const o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.07,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);}

  ${perfect?`<tr><td>Perfect round bonus</td><td class="r">+${perfect}</td></tr>`:''}
  <tr class="tot"><td>Total this round</td><td class="r">+${earned} R$</td></tr></table>
  <div style="font-size:22px;margin-top:12px;display:flex;gap:8px;align-items:center">Bank total: ${COIN} ${fmt(player.total)}</div>
  ${newT!==oldT?`<div class="unlock"><span style="font-size:34px">🎉</span><div class="u">LEVEL UP! You are now a <span class="pill t-${newT}">${newT}</span></div></div>`:''}
  ${newM.map(m=>`<div class="unlock">${avatar({hat:m.hats[0]||player.av.hat,shirt:m.shirts[0]||player.av.shirt},70)}<div class="u">Badge unlocked: <b>${m.name}</b> (${fmt(m.at)} R$)<br><span class="muted" style="font-size:17px">New: ${[...m.hats.map(x=>HATS[x]),...m.shirts.map(x=>x+' shirt')].join(', ')}. Wear it in Rewards!</span></div></div>`).join('')}
  ${nextMilestoneHtml()}
 </div></div>`;
 const tot=$('.tot');if(tot)coinBurst(tot,10);
 if(newM.length||newT!==oldT){setTimeout(sfx.unlock,300);confetti();}else{sfx.fanfare();if(score>=8)confetti();}
 Q=null;}
function nextMilestoneHtml(){const nx=MILESTONES.find(m=>player.total<m.at);if(!nx)return `<p style="font-size:20px">You've unlocked every badge. LEGEND! 👑</p>`;const prev=[...MILESTONES].reverse().find(m=>player.total>=m.at);const lo=prev?prev.at:0;const pc=Math.max(2,Math.round((player.total-lo)/(nx.at-lo)*100));
 return `<div style="margin-top:14px;font-size:18px">Next badge: <b>${nx.name}</b> at ${fmt(nx.at)} R$ (${fmt(nx.at-player.total)} to go)</div><div class="prog"><span style="width:${pc}%"></span></div>`;}
function needPlayer(){if(!player){startMsg='Type your name and pick a level to start!';showStart();return false;}return true;}
function leaveRound(){stopTimer();clearAuto();Q=null;}
function showBank(){if(!needPlayer())return;leaveRound();header();const p=player;const acc=p.answered?Math.round(p.correct/p.answered*100):0;
 app.innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">🏦 ${esc(p.name)}'s Bank</h2><div class="spacer"></div><button class="btn green" data-act="home">Play ▶</button></div>
 <div class="stats" style="margin-top:16px"><div class="stat"><div class="v"><span class="coin big">R$</span>${fmt(p.total)}</div><div class="k">Robux points</div></div>
 <div class="stat"><div class="v">${p.rounds}</div><div class="k">Rounds played</div></div><div class="stat"><div class="v">${acc}%</div><div class="k">Correct answers</div></div><div class="stat"><div class="v">🔥 ${p.bestStreak}</div><div class="k">Best streak</div></div></div>
 ${nextMilestoneHtml()}
 <h3 style="margin-top:18px;font-size:24px">History</h3>
 ${p.history.length?`<div style="max-height:360px;overflow:auto;-webkit-overflow-scrolling:touch"><table class="tbl"><tr><th>Date</th><th>Level</th><th class="r">Score</th><th class="r">R$ earned</th></tr>
 ${p.history.slice(0,100).map(h=>{const d=new Date(h.d);return `<tr><td>${d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}, ${d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</td><td>${esc(h.lvl)}</td><td class="r">${h.score}/${h.of||10}</td><td class="r">+${h.earned}</td></tr>`;}).join('')}</table></div>`:'<p class="muted" style="font-size:20px">No rounds yet. Go and play one!</p>'}
 <div class="row" style="margin-top:20px"><button class="btn red" data-act="reset">Reset my bank</button><span class="muted">Clears R$, history and unlocks for ${esc(p.name)} only.</span></div></div>`;}
function showRewards(){if(!needPlayer())return;leaveRound();header();const p=player,u=unlocked(p.total);
 app.innerHTML=`<div class="grid2" style="grid-template-columns:1fr 1.5fr"><div class="card center"><h2>Your avatar</h2><div style="margin:6px auto">${avatar(p.av,210)}</div><span class="pill t-${titleFor(p.total)}" style="font-size:20px">${titleFor(p.total)}</span>
  <p class="muted" style="font-size:17px;line-height:1.4">Titles: Noob → Builder (250 R$) → Pro (1,000 R$) → Legend (2,500 R$)</p></div>
 <div class="card"><h2>🏅 Badges</h2><p class="muted" style="margin-top:-4px">Badges are free! Earn Robux points to unlock them. You never spend your R$.</p>
  <div class="badges">${MILESTONES.map(m=>{const got=p.total>=m.at;return `<div class="badge ${got?'':'locked'}">${avatar({hat:m.hats[0]||'none',shirt:m.shirts[0]||'green'},62)}<div class="amt">${COIN}${fmt(m.at)}</div><div class="bn">${m.name}</div><div class="bs">${got?'Unlocked!':fmt(m.at-p.total)+' to go'}</div></div>`;}).join('')}</div>
  ${nextMilestoneHtml()}
  <h3 style="margin-top:14px">Hats & gear</h3><div class="opts">${Object.keys(HATS).map(hk=>{const ok=u.hats.includes(hk);return `<button class="opt ${p.av.hat===hk?'sel':''} ${ok?'':'locked'}" data-act="hat" data-h="${hk}" ${ok?'':'disabled'}>${avatar({hat:hk,shirt:p.av.shirt},70)}<div>${HATS[hk]}</div>${ok?'':'<span class="lock">🔒</span>'}</button>`;}).join('')}</div>
  <h3 style="margin-top:14px">Shirt colours</h3><div class="opts">${Object.keys(SHIRTS).map(sk=>{const ok=u.shirts.includes(sk);const bg=SHIRTS[sk]==='rainbow'?'linear-gradient(#ef4444,#facc15,#22c55e,#3b82f6,#a855f7)':SHIRTS[sk];return `<button class="opt ${p.av.shirt===sk?'sel':''} ${ok?'':'locked'}" data-act="shirt" data-s="${sk}" ${ok?'':'disabled'}><div class="sw" style="background:${bg}"></div><div>${sk}</div>${ok?'':'<span class="lock">🔒</span>'}</button>`;}).join('')}</div>
 </div></div>`;}
function showParent(){if(!needPlayer())return;leaveRound();header();const p=player;const acc=p.answered?Math.round(p.correct/p.answered*100):0;
 const rows=Object.keys(TOPICS).filter(t=>p.topics[t]).map(t=>{const s=p.topics[t],a=Math.round(s.c/s.n*100);return `<tr><td>${TOPICS[t]}</td><td class="r">${s.c}/${s.n}</td><td><div class="bar"><span style="width:${a}%;background:${a>=80?'#22c55e':a>=50?'#facc15':'#ef4444'}"></span></div></td><td class="r">${a}%</td></tr>`;}).join('');
 app.innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">👪 Parent area · ${esc(p.name)}</h2><div class="spacer"></div><button class="btn grey" data-act="home">Back</button></div>
 <div class="note"><b>Please note:</b> R$ here are <b>practice points only</b>. They are not real Robux and this game has no link to Roblox. You decide whether to swap them for any real reward. Nothing is bought, no ads are shown and no data leaves this device: everything is saved only in this browser.</div>
 <div class="stats"><div class="stat"><div class="v"><span class="coin big">R$</span>${fmt(p.total)}</div><div class="k">Total earned</div></div><div class="stat"><div class="v">${p.rounds}</div><div class="k">Rounds played</div></div>
 <div class="stat"><div class="v">${acc}%</div><div class="k">Overall accuracy</div></div><div class="stat"><div class="v">${p.answered}</div><div class="k">Questions answered</div></div></div>
 <div class="grid2"><div><h3 style="font-size:24px">Accuracy by topic</h3>${rows?`<table class="tbl" style="font-size:17px"><tr><th>Topic</th><th class="r">Right</th><th></th><th class="r">%</th></tr>${rows}</table>`:'<p class="muted">No answers yet.</p>'}</div>
 <div><h3 style="font-size:24px">Exchange note (optional)</h3><p class="muted" style="margin-top:-4px">Write your house rule, e.g. "100 points = 80 real Robux, paid on Saturdays".</p>
  <textarea id="note" maxlength="300" placeholder="e.g. 100 points = 80 real Robux">${esc(p.note||'')}</textarea>
  <div class="row" style="margin-top:10px"><button class="btn green" data-act="savenote">Save note</button><span id="saved" class="muted"></span></div>
  ${p.note?`<div class="note" style="background:#fefce8;border-color:#ca8a04">Current deal: <b>${esc(p.note)}</b></div>`:''}
  <p class="muted" style="font-size:16px;margin-top:14px;line-height:1.4">Questions follow the UK Year 5 maths curriculum (English National Curriculum). Red bars show topics to practise.</p></div></div></div>`;}
function confirmReset(){if(!player)return;const m=$('#modal');m.classList.remove('hidden');
 m.innerHTML=`<div class="card"><h2>Reset ${esc(player.name)}'s bank?</h2><p>This wipes <b>all ${fmt(player.total)} R$</b>, the history, badges and unlocks for ${esc(player.name)}. It can't be undone.</p><div class="row" style="justify-content:center"><button class="btn grey" data-act="cancelreset">Cancel</button><button class="btn red" data-act="doreset">Yes, reset</button></div></div>`;}
function closeModal(){const m=$('#modal');m.classList.add('hidden');m.innerHTML='';}

/* ============ events ============ */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;actx();const a=el.dataset.act;
 switch(a){
  case 'home':closeModal();showStart();break;
  case 'pickname':{const k=el.dataset.n.trim().toLowerCase();if(store.players[k]){player=store.players[k];store.last=k;save();}sfx.click();showStart();break;}
  case 'level':startRound(el.dataset.l);break;
  case 'again':newRound(LEVELS.find(l=>l.id===+el.dataset.l));sfx.click();showQ();break;
  case 'choose':if(Q&&!Q.locked){answer(Q.qs[Q.i].choices[+el.dataset.k],el);}break;
  case 'key':keyIn(el.dataset.k);break;
  case 'next':nextQ();break;
  case 'bank':showBank();break;
  case 'rewards':showRewards();break;
  case 'parent':showParent();break;
  case 'mute':store.muted=!store.muted;save();header();if(!store.muted)sfx.click();break;
  case 'hat':player.av.hat=el.dataset.h;save();sfx.click();showRewards();break;
  case 'shirt':player.av.shirt=el.dataset.s;save();sfx.click();showRewards();break;
  case 'savenote':player.note=($('#note').value||'').trim();save();sfx.coin();showParent();{const s=$('#saved');if(s)s.textContent='Saved on this device ✓';}break;
  case 'reset':confirmReset();break;
  case 'cancelreset':closeModal();break;
  case 'doreset':{const k=player.name.trim().toLowerCase();store.players[k]=newPlayer(player.name);player=store.players[k];save();closeModal();showBank();break;}
 }});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')){if(e.key==='Enter'&&t.id==='nm'){e.preventDefault();t.blur();}return;}
 if(!Q)return;const q=Q.qs[Q.i];
 if(Q.locked){if(e.key==='Enter'||e.key===' '){e.preventDefault();nextQ();}return;}
 if(q.type==='mc'){const k=+e.key;if(k>=1&&k<=4){const b=document.querySelector(`.choice[data-k="${k-1}"]`);if(b)b.click();}return;}
 if(/^[0-9]$/.test(e.key))keyIn(e.key);else if(e.key==='Backspace'){e.preventDefault();keyIn('del');}else if(e.key==='-')keyIn('-');else if(e.key==='.')keyIn('.');else if(e.key==='Enter')keyIn('ok');});
window.__bmq={G,LEVELS,buildRound,get Q(){return Q;}};
showStart();
})();
</script>
</body>
